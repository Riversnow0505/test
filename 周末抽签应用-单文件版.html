<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周末抽签应用 v2</title>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .app-container {
    max-width: 800px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    padding: 30px 0 20px;
    color: white;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .header p {
    font-size: 14px;
    opacity: 0.85;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .icon { font-size: 18px; }

  /* Time selector grid */
  .time-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .time-option {
    padding: 12px;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .time-option:hover {
    border-color: #667eea;
    background: #f8f7ff;
  }
  .time-option.selected {
    border-color: #667eea;
    background: linear-gradient(135deg, #667eea15, #764ba215);
  }
  .time-option .label {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    margin-bottom: 2px;
  }
  .time-option .desc {
    font-size: 12px;
    color: #888;
  }
  .time-option.selected .label { color: #667eea; }

  /* Filter tags */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .filter-tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1.5px solid #e0e0e0;
    background: white;
    color: #666;
    transition: all 0.2s;
  }
  .filter-tag:hover { border-color: #667eea; color: #667eea; }
  .filter-tag.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
  }

  /* City grid */
  .city-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .city-card {
    padding: 14px;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .city-card:hover {
    border-color: #667eea;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102,126,234,0.15);
  }
  .city-card.visited {
    opacity: 0.5;
  }
  .city-card.visited::after {
    content: "✓";
    position: absolute;
    top: 8px;
    right: 8px;
    background: #4caf50;
    color: white;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .city-card .city-name {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    margin-bottom: 4px;
  }
  .city-card .city-info {
    font-size: 12px;
    color: #888;
  }
  .city-card .city-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .city-card .city-tag {
    font-size: 10px;
    padding: 2px 6px;
    background: #f0f0ff;
    color: #667eea;
    border-radius: 4px;
  }

  /* Draw button */
  .draw-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #667eea, #764ba2);
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    margin-bottom: 16px;
  }
  .draw-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102,126,234,0.5);
  }
  .draw-btn:active { transform: translateY(0); }
  .draw-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Result area */
  .result-area {
    text-align: center;
    padding: 20px;
  }
  .result-destination {
    font-size: 36px;
    font-weight: 800;
    color: #667eea;
    margin: 10px 0;
    animation: popIn 0.5s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 16px;
  }

  /* View itinerary button */
  .view-itinerary-btn {
    padding: 10px 24px;
    border: 2px solid #667eea;
    border-radius: 10px;
    background: white;
    color: #667eea;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .view-itinerary-btn:hover {
    background: #667eea;
    color: white;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-content {
    background: white;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 800px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #eee;
  }
  .modal-header h2 {
    font-size: 22px;
    font-weight: 700;
    color: #333;
  }
  .modal-close {
    width: 32px; height: 32px;
    border: none;
    background: #f5f5f5;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
  }
  .modal-close:hover { background: #eee; }

  /* Itinerary timeline */
  .day-section { margin-bottom: 20px; }
  .day-label {
    font-size: 15px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 10px;
    padding-left: 12px;
    border-left: 3px solid #667eea;
  }
  .activity-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f5f5f5;
  }
  .activity-time {
    font-size: 13px;
    font-weight: 600;
    color: #667eea;
    min-width: 45px;
    padding-top: 2px;
  }
  .activity-detail { flex: 1; }
  .activity-title {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 2px;
  }
  .activity-desc {
    font-size: 12px;
    color: #888;
    line-height: 1.5;
  }
  .activity-food {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    background: #fff3e0;
    color: #e65100;
    border-radius: 4px;
    margin-top: 4px;
  }

  /* Cost section */
  .cost-section {
    background: #f8f7ff;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  .cost-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
  }
  .cost-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .cost-item {
    text-align: center;
    padding: 8px;
    background: white;
    border-radius: 8px;
  }
  .cost-item .cost-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
  }
  .cost-item .cost-value {
    font-size: 16px;
    font-weight: 700;
    color: #667eea;
  }
  .cost-item.total {
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .cost-item.total .cost-label,
  .cost-item.total .cost-value { color: white; }

  /* Tips */
  .tips-section { margin-top: 16px; }
  .tips-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin-bottom: 8px;
  }
  .tip-item {
    font-size: 13px;
    color: #555;
    padding: 6px 0;
    padding-left: 16px;
    position: relative;
    line-height: 1.5;
  }
  .tip-item::before {
    content: "•";
    position: absolute;
    left: 4px;
    color: #667eea;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: space-around;
    padding: 12px;
    background: #f8f7ff;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .stat-item { text-align: center; }
  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #667eea;
  }
  .stat-label {
    font-size: 11px;
    color: #888;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #aaa;
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .card { padding: 16px; }
    .city-grid { grid-template-columns: repeat(2, 1fr); }
    .cost-grid { grid-template-columns: repeat(3, 1fr); }
    .header h1 { font-size: 22px; }
    .result-destination { font-size: 28px; }
  }
</style>
</head>

          {time: "19:30", title: "晚餐", desc: "东莞特色：塘厦碌鹅", food: true}
        ]
      },
      {
        dayKey: "sun",
        dayLabel: "周日",
        activities: [
          {time: "09:00", title: "隐贤山庄", desc: "主题乐园+快活谷玻璃桥"},
          {time: "11:00", title: "南社明清古村落", desc: "保存完好的岭南古村落"},
          {time: "12:30", title: "午餐后返程", desc: "东莞站动车回厦门", food: true}
        ]
      }
    ],
    tips: [
      "可园门票免费，松山湖骑行免费",
      "松山湖自行车租赁约20元/天",
      "虎门炮台免费，海战博物馆免费",
      "东莞美食以烧鹅濑粉最为出名"
    ],
    cost: {"交通": 600, "住宿": 260, "餐饮": 160, "门票": 60, "总计": 1080}
  }
};

window.DEPARTURE_OPTIONS = [
  {value: "fri_morning", label: "周五全天", desc: "9:00出发\u00B7最充裕"},
  {value: "fri_afternoon", label: "周五下午", desc: "14:00出发\u00B7请半天假"},
  {value: "sat_morning", label: "周六上午", desc: "8:00出发\u00B7周末模式"},
  {value: "sat_afternoon", label: "周六下午", desc: "14:00出发\u00B7半日游"}
];

window.RETURN_OPTIONS = [
  {value: "sat_night", label: "周六晚上", desc: "21:00前到家\u00B7一日游"},
  {value: "sun_morning", label: "周日上午", desc: "12:00前到家\u00B7一晚住宿"},
  {value: "sun_afternoon", label: "周日下午", desc: "18:00前到家\u00B7一晚+半天"},
  {value: "sun_night", label: "周日晚上", desc: "21:00前到家\u00B7两晚住宿"}
];

</script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// City metadata (lightweight, kept in component)
const CITY_META = {
  "漳州": {train: "16min", price: 20, tags: ["土楼", "古城"]},
  "泉州": {train: "26min", price: 27, tags: ["开元寺", "西街"]},
  "莲田": {train: "36min", price: 80, tags: ["湄洲岛", "妈祖"]},
  "福州": {train: "57min", price: 126, tags: ["三坊七巷", "平潭"]},
  "龙岩": {train: "1h4m", price: 53, tags: ["土楼", "客家"]},
  "潮汕": {train: "1.5h", price: 93, tags: ["火锅", "古城"]},
  "汕尾": {train: "1h51m", price: 159, tags: ["风车岛", "海滩"]},
  "三明泰宁": {train: "2h", price: 120, tags: ["丹霞", "湖泊"]},
  "宁德": {train: "2h6m", price: 116, tags: ["滩涂", "太姆山"]},
  "武夷山": {train: "2h9m", price: 239, tags: ["九曲溪", "天游峰"]},
  "瑞金": {train: "2h34m", price: 180, tags: ["红色", "丹霞"]},
  "惠州": {train: "2h28m", price: 234, tags: ["海滩", "罗浮山"]},
  "上饶": {train: "2h42m", price: 291, tags: ["三清山", "望仙谷"]},
  "赣州": {train: "2h51m", price: 153, tags: ["古城", "寺庙"]},
  "梅州": {train: "2.5h", price: 130, tags: ["客家", "茶田"]},
  "温州": {train: "3h28m", price: 193, tags: ["雁荡山", "楠溪江"]},
  "金华": {train: "3.5h", price: 260, tags: ["横店", "古村"]},
  "南昌": {train: "4h", price: 408, tags: ["滕王阁", "历史"]},
  "抚州": {train: "3.5h", price: 280, tags: ["漂流", "古村"]},
  "东莞": {train: "3.5h", price: 300, tags: ["可园", "松山湖"]}
};

const DISTANCE_TAGS = ["近郊", "中程", "远程"];
const DISTANCE_MAP = {
  "近郊": ["漳州", "泉州", "莲田", "福州", "龙岩", "潮汕"],
  "中程": ["汕尾", "三明泰宁", "宁德", "武夷山", "瑞金", "惠州", "赣州", "梅州"],
  "远程": ["温州", "金华", "南昌", "抚州", "东莞"]
};

// Dynamic itinerary generation
function generateItinerary(destName, departure, returnTime) {
  const data = window.ITINERARY_DATA[destName];
  if (!data) return null;

  var days = [];
  var tips = data.tips || [];
  var baseCost = data.cost || {};
  var hotelPerNight = baseCost["住宿"] || 200;
  var nights = 0;

  // Determine which days to show
  var showFri = (departure === "fri_morning" || departure === "fri_afternoon");
  var showSat = true;
  var showSun = (returnTime === "sun_morning" || returnTime === "sun_afternoon" || returnTime === "sun_night");

  // Filter Friday activities
  if (showFri) {
    var friDay = data.baseDays.find(function(d) { return d.dayKey === "fri_afternoon"; });
    if (friDay) {
      var friActivities = friDay.activities.slice();
      if (departure === "fri_morning") {
        // Add morning activity placeholder
        friActivities.unshift({time: "09:00", title: "早到待处", desc: "提前到达，可先去酒店放行李"});
      }
      days.push({dayLabel: "周五", activities: friActivities});
      nights++;
    }
  }

  // Filter Saturday activities
  if (showSat) {
    var satDay = data.baseDays.find(function(d) { return d.dayKey === "sat"; });
    if (satDay) {
      var satActivities = satDay.activities.slice();
      // If departure is sat_afternoon, filter out morning activities (time < 13:00)
      if (departure === "sat_afternoon") {
        satActivities = satActivities.filter(function(a) {
          var hour = parseInt(a.time.split(":")[0]);
          return hour >= 13;
        });
      }
      // If return is sat_night, cut activities at 18:00
      if (returnTime === "sat_night") {
        satActivities = satActivities.filter(function(a) {
          var hour = parseInt(a.time.split(":")[0]);
          return hour < 18;
        });
        satActivities.push({time: "18:00", title: "返程", desc: "动车/驾车返回厦门"});
      }
      if (satActivities.length > 0) {
        days.push({dayLabel: "周六", activities: satActivities});
        if (returnTime !== "sat_night") {
          nights++;
        }
      }
    }
  }

  // Filter Sunday activities
  if (showSun) {
    var sunDay = data.baseDays.find(function(d) { return d.dayKey === "sun"; });
    if (sunDay) {
      var sunActivities = sunDay.activities.slice();
      // If return is sun_morning, only show morning activities (time < 12:00)
      if (returnTime === "sun_morning") {
        sunActivities = sunActivities.filter(function(a) {
          var hour = parseInt(a.time.split(":")[0]);
          return hour < 12;
        });
        sunActivities.push({time: "12:00", title: "返程", desc: "动车/驾车返回厦门"});
      }
      // If return is sun_afternoon, only show activities before 15:00
      if (returnTime === "sun_afternoon") {
        sunActivities = sunActivities.filter(function(a) {
          var hour = parseInt(a.time.split(":")[0]);
          return hour < 15;
        });
        sunActivities.push({time: "15:00", title: "返程", desc: "动车/驾车返回厦门"});
      }
      if (returnTime === "sun_night") {
        sunActivities.push({time: "18:00", title: "返程", desc: "动车/驾车返回厦门"});
      }
      if (sunActivities.length > 0) {
        days.push({dayLabel: "周日", activities: sunActivities});
      }
    }
  }

  // Calculate cost
  var totalHotel = hotelPerNight * nights;
  var totalCost = baseCost["交通"] + totalHotel + baseCost["餐饮"] + baseCost["门票"];
  var cost = {
    "交通": baseCost["交通"],
    "住宿": totalHotel,
    "餐饮": baseCost["餐饮"],
    "门票": baseCost["门票"],
    "总计": totalCost
  };

  return {days: days, tips: tips, cost: cost, nights: nights};
}

// Main App
function App() {
  const [departure, setDeparture] = useState("fri_afternoon");
  const [returnTime, setReturnTime] = useState("sun_night");
  const [distanceFilter, setDistanceFilter] = useState(null);
  const [visited, setVisited] = useState(JSON.parse(localStorage.getItem("wknd_visited") || "[]"));
  const [result, setResult] = useState(null);
  const [isDrawing, setIsDrawing] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const [modalData, setModalData] = useState(null);
  const drawTimerRef = useRef(null);

  const allCities = Object.keys(window.ITINERARY_DATA);

  const filteredCities = allCities.filter(function(city) {
    if (distanceFilter && DISTANCE_MAP[distanceFilter]) {
      return DISTANCE_MAP[distanceFilter].indexOf(city) !== -1;
    }
    return true;
  });

  const availableCities = filteredCities.filter(function(city) {
    return visited.indexOf(city) === -1;
  });

  const toggleVisited = function(city) {
    var newList = visited.indexOf(city) === -1
      ? visited.concat([city])
      : visited.filter(function(c) { return c !== city; });
    setVisited(newList);
    localStorage.setItem("wknd_visited", JSON.stringify(newList));
  };

  const draw = function() {
    if (availableCities.length === 0 || isDrawing) return;
    setIsDrawing(true);
    setResult(null);

    var count = 0;
    var total = 15;
    drawTimerRef.current = setInterval(function() {
      var randomCity = availableCities[Math.floor(Math.random() * availableCities.length)];
      setResult({city: randomCity, phase: "drawing"});
      count++;
      if (count >= total) {
        clearInterval(drawTimerRef.current);
        var finalCity = availableCities[Math.floor(Math.random() * availableCities.length)];
        setResult({city: finalCity, phase: "done"});
        setIsDrawing(false);
      }
    }, 100);
  };

  const viewItinerary = function(city) {
    var data = generateItinerary(city, departure, returnTime);
    if (data) {
      setModalData({city: city, itinerary: data});
      setShowModal(true);
    }
  };

  const closeModal = function() {
    setShowModal(false);
    setModalData(null);
  };

  var departLabel = window.DEPARTURE_OPTIONS.find(function(o) { return o.value === departure; });
  var returnLabel = window.RETURN_OPTIONS.find(function(o) { return o.value === returnTime; });

  return (
    <div className="app-container">
      <div className="header">
        <h1>✈ 周末抽签应用 v2</h1>
        <p>从厦门出发，随机抽取一个周末目的地</p>
      </div>

      {/* Time Selector */}
      <div className="card">
        <div className="section-title"><span className="icon">⏰</span> 出发时间</div>
        <div className="time-selector">
          {window.DEPARTURE_OPTIONS.map(function(opt) {
            return (
              <div
                key={opt.value}
                className={"time-option" + (departure === opt.value ? " selected" : "")}
                onClick={function() { setDeparture(opt.value); }}
              >
                <div className="label">{opt.label}</div>
                <div className="desc">{opt.desc}</div>
              </div>
            );
          })}
        </div>
        <div className="section-title"><span className="icon">🏁</span> 回程时间</div>
        <div className="time-selector">
          {window.RETURN_OPTIONS.map(function(opt) {
            return (
              <div
                key={opt.value}
                className={"time-option" + (returnTime === opt.value ? " selected" : "")}
                onClick={function() { setReturnTime(opt.value); }}
              >
                <div className="label">{opt.label}</div>
                <div className="desc">{opt.desc}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Stats */}
      <div className="card" style={{padding: "16px"}}>
        <div className="stats-bar">
          <div className="stat-item">
            <div className="stat-value">{allCities.length}</div>
            <div className="stat-label">总城市</div>
          </div>
          <div className="stat-item">
            <div className="stat-value">{visited.length}</div>
            <div className="stat-label">已去过</div>
          </div>
          <div className="stat-item">
            <div className="stat-value">{availableCities.length}</div>
            <div className="stat-label">可抽取</div>
          </div>
          <div className="stat-item">
            <div className="stat-value">{departLabel ? departLabel.label : ""} - {returnLabel ? returnLabel.label : ""}</div>
            <div className="stat-label">行程时间</div>
          </div>
        </div>
      </div>

      {/* Filter */}
      <div className="card">
        <div className="section-title"><span className="icon">🔍</span> 距离筛选</div>
        <div className="filter-bar">
          <div
            className={"filter-tag" + (distanceFilter === null ? " active" : "")}
            onClick={function() { setDistanceFilter(null); }}
          >全部</div>
          {DISTANCE_TAGS.map(function(tag) {
            return (
              <div
                key={tag}
                className={"filter-tag" + (distanceFilter === tag ? " active" : "")}
                onClick={function() { setDistanceFilter(tag); }}
              >{tag} ({DISTANCE_MAP[tag].length})</div>
            );
          })}
        </div>
      </div>

      {/* City Grid */}
      <div className="card">
        <div className="section-title"><span className="icon">🏙</span> 目的地城市 <span style={{fontSize:"12px",color:"#aaa",fontWeight:"400"}}>点击标记已去过</span></div>
        <div className="city-grid">
          {filteredCities.map(function(city) {
            var meta = CITY_META[city] || {};
            var isVisited = visited.indexOf(city) !== -1;
            return (
              <div
                key={city}
                className={"city-card" + (isVisited ? " visited" : "")}
                onClick={function() { toggleVisited(city); }}
              >
                <div className="city-name">{city}</div>
                <div className="city-info">{meta.train || ""} / {meta.price ? "¥" + meta.price : ""}</div>
                <div className="city-tags">
                  {(meta.tags || []).map(function(t) {
                    return <span key={t} className="city-tag">{t}</span>;
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Draw Button */}
      <button
        className="draw-btn"
        onClick={draw}
        disabled={availableCities.length === 0 || isDrawing}
      >
        {isDrawing ? "🎲 抽签中..." :
         availableCities.length === 0 ? "所有城市都去过了！" :
         "🎲 开始抽签！"}
      </button>

      {/* Result */}
      {result && (
        <div className="card result-area">
          {result.phase === "drawing" ? (
            <div>
              <div style={{fontSize: "14px", color: "#aaa"}}>抽签中...</div>
              <div className="result-destination" key={result.city}>{result.city}</div>
            </div>
          ) : (
            <div>
              <div style={{fontSize: "14px", color: "#aaa"}}>🎉 本周末去</div>
              <div className="result-destination">{result.city}</div>
              <div className="result-subtitle">
                {CITY_META[result.city] ? CITY_META[result.city].train + " / ¥" + CITY_META[result.city].price : ""}
                {" | " + departLabel.label + " - " + returnLabel.label}
              </div>
              <button className="view-itinerary-btn" onClick={function() { viewItinerary(result.city); }}>
                📋 查看行程安排
              </button>
            </div>
          )}
        </div>
      )}

      {/* Empty state */}
      {availableCities.length === 0 && !result && (
        <div className="card">
          <div className="empty-state">
            <div className="emoji">🎉</div>
            <p>太棒了！所有城市都去过了！</p>
            <p style={{fontSize: "12px", color: "#ccc", marginTop: "8px"}}>点击城市卡片可以取消标记</p>
          </div>
        </div>
      )}

      {/* Itinerary Modal */}
      {showModal && modalData && (
        <div className="modal-overlay" onClick={closeModal}>
          <div className="modal-content" onClick={function(e) { e.stopPropagation(); }}>
            <div className="modal-header">
              <h2>{modalData.city} 行程安排</h2>
              <button className="modal-close" onClick={closeModal}>×</button>
            </div>

            <div style={{fontSize: "13px", color: "#888", marginBottom: "16px"}}>
              {departLabel.label} 出发 → {returnLabel.label} 回程
              {modalData.itinerary.nights > 0 ? " | " + modalData.itinerary.nights + "晚住宿" : " | 无需住宿"}
            </div>

            {/* Timeline */}
            {modalData.itinerary.days.map(function(day, idx) {
              return (
                <div key={idx} className="day-section">
                  <div className="day-label">{day.dayLabel}</div>
                  {day.activities.map(function(act, aidx) {
                    return (
                      <div key={aidx} className="activity-item">
                        <div className="activity-time">{act.time}</div>
                        <div className="activity-detail">
                          <div className="activity-title">{act.title}</div>
                          <div className="activity-desc">{act.desc}</div>
                          {act.food && <span className="activity-food">🍽 美食</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}

            {/* Cost */}
            <div className="cost-section">
              <div className="cost-title">💰 预估费用</div>
              <div className="cost-grid">
                {Object.keys(modalData.itinerary.cost).map(function(key) {
                  var isTotal = key === "总计";
                  return (
                    <div key={key} className={"cost-item" + (isTotal ? " total" : "")}>
                      <div className="cost-label">{key}</div>
                      <div className="cost-value">¥{modalData.itinerary.cost[key]}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Tips */}
            <div className="tips-section">
              <div className="tips-title">💡 实用贴士</div>
              {modalData.itinerary.tips.map(function(tip, idx) {
                return <div key={idx} className="tip-item">{tip}</div>;
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Render
var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
